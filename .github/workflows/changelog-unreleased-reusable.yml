# .github/workflows/changelog-unreleased-reusable.yml
name: Changelog / Update Unreleased (Reusable)

on:
  workflow_call:
    inputs:
      unreleased_branch:
        description: Branch que recebe a seção "Não publicado"
        required: true
        type: string
      workflow_repository:
        description: Repositório que contém os scripts do changelog
        required: true
        type: string
      workflow_ref:
        description: Ref (branch/tag/sha) do repositório do workflow
        required: true
        type: string
      node_version:
        description: Versão do Node.js para executar os scripts
        required: false
        type: string
        default: "18"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog_unreleased:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.unreleased_branch }}

      - name: Sync branch
        run: |
          BRANCH="${{ inputs.unreleased_branch }}"

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflow_repository }}
          ref: ${{ inputs.workflow_ref }}
          path: .changelog-workflow

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Generate unreleased changelog
        run: node .changelog-workflow/scripts/update-unreleased.js

      - name: Commit and push changelog
        run: |
          BRANCH="${{ inputs.unreleased_branch }}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Sem mudanças"
            exit 0
          fi

          git commit -m 'docs: Atualização da seção "Não publicado" do changelog'

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          git push origin "$BRANCH"