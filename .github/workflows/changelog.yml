name: Generate Changelog

env:
  RELEASE_BRANCH: master

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Validate release on release branch
        id: detect_branch
        run: |
          echo "Validando release na $RELEASE_BRANCH..."

          TAG="${{ github.event.release.tag_name }}"
          TARGET_COMMITISH="${{ github.event.release.target_commitish }}"

          git fetch origin "$RELEASE_BRANCH" --tags

          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$TAG")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$RELEASE_BRANCH"; then
            echo "Tag $TAG não está contida na $RELEASE_BRANCH (target_commitish: $TARGET_COMMITISH)"
            echo "SKIP_CHANGELOG=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Tag validada na $RELEASE_BRANCH (target_commitish: $TARGET_COMMITISH)"
          echo "TARGET_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV

      - name: Prepare release info
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Promote unreleased to release
        if: env.SKIP_CHANGELOG != 'true'
        run: npm run changelog:release -- --version "$RELEASE_VERSION" --date "$RELEASE_DATE"

      - name: Commit and push changelog
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          echo "Usando branch: $TARGET_BRANCH"

          git checkout "$TARGET_BRANCH"
          git pull origin "$TARGET_BRANCH"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add CHANGELOG.md
          git commit -m "docs: Atualização do changelog para ${{ github.ref }}" || echo "Sem mudanças"
          git push origin "$TARGET_BRANCH"

      - name: Update GitHub Release
        if: env.SKIP_CHANGELOG != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
