name: Auto Generate Changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Generate changelog
        run: npm run changelog

      # 🔍 detectar branch da tag
      - name: Detect branch of tag
        id: detect_branch
        run: |
          echo "Detectando branch da tag..."

          BRANCH=$(git branch -r --contains "${GITHUB_SHA}" \
            | grep -v '->' \
            | sed 's|origin/||' \
            | head -n 1 \
            | tr -d '[:space:]')

          if [ -z "$BRANCH" ]; then
            BRANCH="development"
            echo "Fallback para development"
          fi

          echo "Branch detectada: $BRANCH"
          echo "TARGET_BRANCH=$BRANCH" >> $GITHUB_ENV

      # 🧾 commit e push
      - name: Commit and push changelog
        run: |
          echo "Usando branch: $TARGET_BRANCH"

          git checkout "$TARGET_BRANCH"
          git pull origin "$TARGET_BRANCH"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref }}" || echo "Sem mudanças"
          git push origin "$TARGET_BRANCH"

      # 🚀 atualizar release
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md