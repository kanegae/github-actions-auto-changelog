name: Update Unreleased Changelog

env:
  UNRELEASED_BRANCH: development

on:
  pull_request:
    branches:
      - "development" # manter em sincronia com env.UNRELEASED_BRANCH
    types:
      - closed

permissions:
  contents: write

jobs:
  changelog_unreleased:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.UNRELEASED_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Generate unreleased changelog
        run: npm run changelog:unreleased

      - name: Commit and push changelog
        run: |
          BRANCH="${{ env.UNRELEASED_BRANCH }}"

          git checkout "$BRANCH"
          git pull origin "$BRANCH"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add CHANGELOG.md
          git commit -m 'docs: Atualização da seção "Não publicado" do changelog' || echo "Sem mudanças"
          git push origin "$BRANCH"