# .github/workflows/changelog-release-reusable.yml
name: Changelog / Generate Release (Reusable)

on:
  workflow_call:
    inputs:
      release_branch:
        description: Branch usada para validar e receber o commit do changelog
        required: true
        type: string
      workflow_repository:
        description: Repositório que contém os scripts do changelog
        required: true
        type: string
      workflow_ref:
        description: Ref (branch/tag/sha) do repositório do workflow
        required: true
        type: string
      node_version:
        description: Versão do Node.js para executar os scripts
        required: false
        type: string
        default: "18"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflow_repository }}
          ref: ${{ inputs.workflow_ref }}
          path: .changelog-workflow

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Validate release on release branch
        id: detect_branch
        run: |
          echo "Validando release na ${{ inputs.release_branch }}..."

          TAG="${{ github.event.release.tag_name }}"
          TARGET_COMMITISH="${{ github.event.release.target_commitish }}"

          if ! git ls-remote --exit-code --heads origin "${{ inputs.release_branch }}" > /dev/null; then
            echo "Branch ${{ inputs.release_branch }} não existe no remoto."
            echo "SKIP_CHANGELOG=true" >> $GITHUB_ENV
            exit 0
          fi

          git fetch origin "${{ inputs.release_branch }}" --tags

          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$TAG")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/${{ inputs.release_branch }}"; then
            echo "Tag $TAG não está contida na ${{ inputs.release_branch }} (target_commitish: $TARGET_COMMITISH)"
            echo "SKIP_CHANGELOG=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Tag validada na ${{ inputs.release_branch }} (target_commitish: $TARGET_COMMITISH)"
          echo "TARGET_BRANCH=${{ inputs.release_branch }}" >> $GITHUB_ENV

      - name: Prepare release info
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PUBLISHED_AT="${{ github.event.release.published_at }}"
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          if [ -n "$PUBLISHED_AT" ]; then
            RELEASE_DATE="${PUBLISHED_AT%%T*}"
          else
            RELEASE_DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_ENV

      - name: Checkout target branch
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          echo "Usando branch: $TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

      - name: Promote unreleased to release
        if: env.SKIP_CHANGELOG != 'true'
        run: node .changelog-workflow/scripts/promote-release.js --version "$RELEASE_VERSION" --date "$RELEASE_DATE"

      - name: Extract release notes
        if: env.SKIP_CHANGELOG != 'true'
        run: node .changelog-workflow/scripts/extract-release-notes.js --version "$RELEASE_VERSION"

      - name: Commit and push changelog
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Sem mudanças"
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add CHANGELOG.md
          git commit -m "docs: Atualização do changelog para ${{ github.ref }}"
          git push origin "$TARGET_BRANCH"

      - name: Update GitHub Release
        if: ${{ env.SKIP_CHANGELOG != 'true' && hashFiles('RELEASE_NOTES.md') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md