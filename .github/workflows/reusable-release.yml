name: Generate Changelog (Reusable)

on:
  workflow_call:
    inputs:
      release_branch:
        description: Branch usada para validar e receber o commit do changelog
        required: true
        type: string
      workflow_repository:
        description: Repositório que contém os scripts do changelog
        required: true
        type: string
      workflow_ref:
        description: Ref (branch/tag/sha) do repositório do workflow
        required: true
        type: string
      node_version:
        description: Versão do Node.js para executar os scripts
        required: false
        type: string
        default: "18"
    secrets:
      workflow_token:
        description: Token opcional para checkout do repositório do workflow
        required: false

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflow_repository }}
          ref: ${{ inputs.workflow_ref }}
          path: .changelog-workflow
          token: ${{ secrets.workflow_token || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Validate release on release branch
        id: detect_branch
        run: |
          echo "Validando release na ${{ inputs.release_branch }}..."

          TAG="${{ github.event.release.tag_name }}"
          TARGET_COMMITISH="${{ github.event.release.target_commitish }}"

          if ! git ls-remote --exit-code --heads origin "${{ inputs.release_branch }}" > /dev/null; then
            echo "Branch ${{ inputs.release_branch }} não existe no remoto."
            echo "SKIP_CHANGELOG=true" >> $GITHUB_ENV
            exit 0
          fi

          git fetch origin "${{ inputs.release_branch }}" --tags

          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$TAG")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/${{ inputs.release_branch }}"; then
            echo "Tag $TAG não está contida na ${{ inputs.release_branch }} (target_commitish: $TARGET_COMMITISH)"
            echo "SKIP_CHANGELOG=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Tag validada na ${{ inputs.release_branch }} (target_commitish: $TARGET_COMMITISH)"
          echo "TARGET_BRANCH=${{ inputs.release_branch }}" >> $GITHUB_ENV

      - name: Prepare release info
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Promote unreleased to release
        if: env.SKIP_CHANGELOG != 'true'
        run: node .changelog-workflow/scripts/promote-release.js --version "$RELEASE_VERSION" --date "$RELEASE_DATE"

      - name: Commit and push changelog
        if: env.SKIP_CHANGELOG != 'true'
        run: |
          echo "Usando branch: $TARGET_BRANCH"

          git checkout "$TARGET_BRANCH"
          git pull origin "$TARGET_BRANCH"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add CHANGELOG.md
          git commit -m "docs: Atualização do changelog para ${{ github.ref }}" || echo "Sem mudanças"
          git push origin "$TARGET_BRANCH"

      - name: Update GitHub Release
        if: env.SKIP_CHANGELOG != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md